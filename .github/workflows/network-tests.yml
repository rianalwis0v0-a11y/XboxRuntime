name: Guest networking validation

on:
  pull_request:
    paths:
      - "guest32/**"
      - "tests/network_smoke.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/network-tests.yml"
  push:
    branches:
      - work/xbox-networking-integration
  workflow_dispatch:

concurrency:
  group: xbox-networking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-network:
    runs-on: windows-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure dedicated x86 guest
        run: cmake -S guest32 -B build-guest32 -A Win32

      - name: Build dedicated x86 guest
        run: cmake --build build-guest32 --config Release --target xbe_guest32

      - name: Configure host-side networking smoke target
        run: cmake -S . -B build-network-smoke -A x64 -DXBOXRECOMP_BUILD_TESTS=OFF

      - name: Build networking smoke test
        run: cmake --build build-network-smoke --config Release --target network_smoke

      - name: Run networking smoke test
        run: ctest --test-dir build-network-smoke -C Release --output-on-failure -R "^network_smoke$"
