name: Build NV2A module

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out XboxRuntime and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure x64 build
        run: cmake -S . -B build -A x64 -DXBOXRECOMP_BUILD_TESTS=OFF

      - name: Build NV2A translation module
        run: cmake --build build --config Release --target nv2a

      - name: Verify output
        shell: pwsh
        run: |
          $dll = "build/out/nv2a.dll"
          if (!(Test-Path $dll)) {
            throw "Expected output not found: $dll"
          }
          Get-Item $dll | Format-List FullName,Length

      - name: Upload NV2A module
        uses: actions/upload-artifact@v4
        with:
          name: xboxruntime-nv2a-win-x64
          path: build/out/nv2a.dll
          if-no-files-found: error
