name: Build XboxRuntime modules

on:
  pull_request:
  push:
    branches:
      - work/nv2a-d3d11-integration
  workflow_dispatch:

concurrency:
  group: xboxruntime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out XboxRuntime and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python for kernel export audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Audit all Xbox kernel export ordinals
        run: python tools/audit_kernel_exports.py --check

      - name: Configure x64 host
        run: cmake -S . -B build -A x64 -DXBOXRECOMP_BUILD_TESTS=OFF

      - name: Build x64 host modules
        run: cmake --build build --config Release --target boot main nv2a insignia_dns xbe_loader fatx fatx_smoke nv2a_smoke input input_smoke xdvdfs xdvdfs_smoke

      - name: Test FATX, NV2A, controller input, and XDVDFS host subsystems
        run: ctest --test-dir build -C Release --output-on-failure -R "fatx_smoke|nv2a_smoke|nv2a_vsh_smoke|input_smoke|xdvdfs_smoke"

      - name: Configure native x86 guest process
        run: cmake -S guest32 -B build-guest32 -A Win32

      - name: Build native x86 guest process
        run: cmake --build build-guest32 --config Release --target xbe_guest32

      - name: Stage x86 guest beside host loader
        shell: pwsh
        run: Copy-Item "build-guest32/out/xbe_guest32.exe" "build/out/xbe_guest32.exe" -Force

      - name: Smoke-test native x86 XBE execution
        shell: pwsh
        run: ./.github/scripts/test-native-x86-guest.ps1

      - name: Build and run comprehensive diagnostic XBE
        shell: pwsh
        run: ./.github/scripts/test-diagnostic-xbe.ps1

      - name: Verify outputs
        shell: pwsh
        run: |
          $files = @(
            "build/out/boot.exe",
            "build/out/main.dll",
            "build/out/nv2a.dll",
            "build/out/insignia_dns.dll",
            "build/out/xbe_loader.dll",
            "build/out/fatx.dll",
            "build/out/input.dll",
            "build/out/xdvdfs.dll",
            "build/out/xbe_guest32.exe",
            "build/out/xboxruntime-diagnostic.xbe"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Expected output not found: $file" }
            Get-Item $file | Format-List FullName,Length
          }

      - name: Upload runtime modules
        uses: actions/upload-artifact@v4
        with:
          name: xboxruntime-host-x64-guest-x86
          path: |
            build/out/boot.exe
            build/out/main.dll
            build/out/nv2a.dll
            build/out/insignia_dns.dll
            build/out/xbe_loader.dll
            build/out/fatx.dll
            build/out/input.dll
            build/out/xdvdfs.dll
            build/out/xbe_guest32.exe
            build/out/xboxruntime-diagnostic.xbe
          if-no-files-found: error
