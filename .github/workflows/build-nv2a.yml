name: Build XboxRuntime modules

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out XboxRuntime and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure x64 build
        run: cmake -S . -B build -A x64 -DXBOXRECOMP_BUILD_TESTS=OFF

      - name: Build NV2A and Insignia DNS modules
        run: cmake --build build --config Release --target boot main nv2a insignia_dns

      - name: Verify outputs
        shell: pwsh
        run: |
          $files = @("build/out/boot.exe", "build/out/main.dll", "build/out/nv2a.dll", "build/out/insignia_dns.dll")
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Expected output not found: $file" }
            Get-Item $file | Format-List FullName,Length
          }

      - name: Upload runtime modules
        uses: actions/upload-artifact@v4
        with:
          name: xboxruntime-modules-win-x64
          path: |
            build/out/boot.exe
            build/out/main.dll
            build/out/nv2a.dll
            build/out/insignia_dns.dll
          if-no-files-found: error
