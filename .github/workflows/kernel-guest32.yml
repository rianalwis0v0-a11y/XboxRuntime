name: Kernel guest32 build and networking tests

on:
  push:
    branches:
      - work/kernel-execution-backend
  pull_request:
    branches:
      - work/kernel-execution-backend
  workflow_dispatch:

concurrency:
  group: kernel-guest32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest32:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Audit kernel export catalogue
        run: python tools/audit_kernel_exports.py --check

      - name: Configure x86 guest
        run: cmake -S guest32 -B build-guest32 -A Win32

      - name: Build x86 guest and network smoke test
        run: cmake --build build-guest32 --config Release --target xbe_guest32 network_smoke

      - name: Run networking smoke test
        run: ctest --test-dir build-guest32 -C Release --output-on-failure -R network_smoke
