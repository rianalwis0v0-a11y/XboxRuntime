name: XboxNet DNS server tests

on:
  push:
    branches: [xboxnet]
    paths:
      - "modules/xboxnet/**"
      - ".github/workflows/xboxnet-dns.yml"
  pull_request:
    paths:
      - "modules/xboxnet/**"
      - ".github/workflows/xboxnet-dns.yml"
  workflow_dispatch:

jobs:
  dns-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run DNS unit tests
        working-directory: modules/xboxnet
        run: python -m unittest discover -s tests -v
